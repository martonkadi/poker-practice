name: Deploy guest MVP
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Build-time variables apply to the `build` task inside `pnpm check`,
      # which produces the single `dist/` that is tested and then deployed.
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_PUBLISHABLE_KEY: ''
      VITE_APP_ENV: production
      VITE_GIT_COMMIT: ${{ github.sha }}
    steps:
      # Ties the run log to the Candidate_Commit (Req 11.8).
      - name: Print candidate commit
        run: echo "Candidate commit ${{ github.sha }}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm install --global corepack@0.35.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Confirm static deployment configuration
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      # lint, typecheck, test, test:tools, build, check:dist (tools/run-check.mjs).
      - name: Release checks and production build
        run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      # Serves the existing dist/ via tools/serve-dist.mjs; never rebuilds.
      - name: Browser suite (Chromium, Firefox, WebKit) on dist
        run: pnpm test:e2e:release
      - run: python -m pip install --require-hashes --no-deps -r tools/reference/requirements.txt
      - name: PokerKit reference check
        run: python tools/reference/pokerkit_rules.py
      # wrangler.jsonc declares static assets only (./dist) and no build
      # command, so this uploads the tested dist/ unchanged.
      - name: Deploy static assets
        run: pnpm exec wrangler deploy
      - name: Install Chromium for live smoke check
        run: pnpm exec playwright install --with-deps chromium
      - name: Live smoke check (Chromium)
        run: pnpm smoke:live --url https://poker-practice.marton-kadi.workers.dev --commit ${{ github.sha }}
