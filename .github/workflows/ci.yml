name: CI
on:
  pull_request:
  # main is the only release branch. This run is also the GitHub Actions
  # fallback for Release_Checks that cannot run locally; record its URL
  # against the same SHA.
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Same guest-only build inputs as deploy.yml, so this run checks the
    # artifact the Deploy_Workflow would build from the same commit.
    env:
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_PUBLISHABLE_KEY: ''
      VITE_APP_ENV: production
      VITE_GIT_COMMIT: ${{ github.sha }}
    steps:
      - name: Print commit SHA
        run: echo "Checking commit ${{ github.sha }}"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm install --global corepack@0.35.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # lint, typecheck, test, test:tools, build, check:dist (tools/run-check.mjs)
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      # Chromium, Firefox and WebKit against the dist built above (no rebuild).
      # playwright.config.ts sets retries: 0 and forbidOnly: true (Req 10.6).
      - run: pnpm test:e2e:release
      - run: python -m pip install --require-hashes --no-deps -r tools/reference/requirements.txt
      - run: python tools/reference/pokerkit_rules.py
  database:
    # Cloud sync is deferred for the guest MVP, so its local Supabase checks are
    # not Release_Checks. They run only when this workflow is started manually.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm install --global corepack@0.35.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start
      - run: pnpm exec supabase db reset
      - run: pnpm test:db
